# Suuper on the server IP, port 9443 (until a domain is added).
# Reuses the Let's Encrypt IP certificate the store already renews.
#   /      -> web (Next.js)       127.0.0.1:3200
#   /api/  -> api-gateway          127.0.0.1:3110 (prefix stripped)
server {
    listen 9443 ssl;
    http2 on;
    server_name 187.77.118.163;

    ssl_certificate     /etc/letsencrypt/live/techlife-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techlife-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Plain HTTP sent to this HTTPS port -> redirect
    error_page 497 =301 https://$host:9443$request_uri;

    client_max_body_size 10M;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/ {
        proxy_pass http://127.0.0.1:3110/;
        # Agent runs stream over SSE: don't buffer, allow long runs.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
