# Suuper on https://app.suuper.cc (Let's Encrypt cert "app.suuper.cc", webroot renewal).
#   /      -> web (Next.js)       127.0.0.1:3200
#   /api/  -> api-gateway          127.0.0.1:3110 (prefix stripped)

server {
    listen 80;
    listen [::]:80;
    server_name app.suuper.cc;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.suuper.cc;

    ssl_certificate     /etc/letsencrypt/live/app.suuper.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.suuper.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10M;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/ {
        proxy_pass http://127.0.0.1:3110/;
        # Agent runs stream over SSE: don't buffer, allow long runs.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# Old address (IP, port 9443): send people to the domain. Once nothing uses it,
# delete this block and run: ufw delete allow 9443/tcp
server {
    listen 9443 ssl;
    http2 on;
    server_name 187.77.118.163;

    ssl_certificate     /etc/letsencrypt/live/techlife-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techlife-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    error_page 497 =301 https://app.suuper.cc$request_uri;
    return 301 https://app.suuper.cc$request_uri;
}
